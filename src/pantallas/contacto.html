<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban-Fit</title>
    <link rel="stylesheet" href="contacto.css" />
  </head>
  <body id="body">
    <div class="header">
      <div class="top-bar">
        <img class="logo" src="../../assets/logo.png" alt="logo" />
        <nav class="navbar">
          <ul class="lista">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="contacto.html">Contacto</a></li>
          </ul>
        </nav>
      </div>
      <div class="title">
        <h2 class="contact">Contactanos</h2>
      </div>
      <section class="caja">
        <div class="contenido">
          <div class="left-column">
            <h3>Lorem ipsum dolor</h3>
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit...</p>
            <form action="urbanfit@gmail.com" method="post">
              <label for="apellido">Last name</label><br />
              <input type="text" id="apellido" name="apellido" /><br /><br />
              <label for="nombre">First name</label><br />
              <input type="text" id="nombre" name="nombre" /><br /><br />
              <label for="email">Email</label><br />
              <input type="email" id="email" name="email" /><br /><br />
              <label for="telefono">Phone number</label><br />
              <input type="text" id="telefono" name="telefono" /><br /><br />
              <label for="mensaje">Mensaje:</label><br />
              <textarea id="mensaje" name="mensaje"></textarea><br /><br />
              <input type="submit" value="Enviar" />
            </form>
          </div>

          <div class="right-column">
            <img class="foto" src="../../assets/1.jpg" alt="foto" />
          </div>
        </div>
      </section>
      <footer>
        <div class="footer">
          <img class="logo" src="../../assets/logo.png" alt="logo" />
        </div>
      </footer>
    </div>
  </body>
</html>
